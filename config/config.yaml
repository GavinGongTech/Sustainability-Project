# ─────────────────────────────────────────────────────────────────────────────
# SOURCE PRIORITY — what to fetch per segment, in order
# ─────────────────────────────────────────────────────────────────────────────
source_priority:
  us_public:    [10-K Item 1, 10-K Item 7, ESG report, IR presentation, patent, press release]
  non_us_public: [annual report, 20-F, 40-F, ESG report, IR presentation, exchange filing, patent]
  startup:      [product page, engineering blog, press release, white paper, patent, founder interview]

