    - 2842   # Specialty Cleaning, Polishing & Sanitation Preparations

# ── NAICS codes (supplementary) ───────────────────────────────────────────────
# Used where SIC is not granular enough to distinguish what we care about.
# Nuclear fission has a clean NAICS home; no SIC equivalent exists.
# Carbon Removal / CCU and Nuclear Fusion have no clean SIC or NAICS home —
# confirmed as "frontier industries" with no single classification code.
# They are retained as research-defined tags only.

naics_codes:

  # Nuclear (fission) — clean single-code NAICS home
  nuclear_fission:
    - 221113  # Nuclear Electric Power Generation

  # Advanced materials — supplementary granularity within SIC 28/30
  advanced_materials:
    - 325211  # Plastics Material & Resin Manufacturing
    - 325220  # Artificial & Synthetic Fibers & Filaments Manufacturing
    - 327910  # Abrasive Product Manufacturing
    - 325180  # Other Basic Inorganic Chemical Manufacturing
    - 325190  # Other Basic Organic Chemical Manufacturing
    - 325412  # Pharmaceutical Preparation Manufacturing
    - 325413  # In-Vitro Diagnostic Substance Manufacturing

  # Agrifood tech — supplementary within SIC 01 and SIC 20
  agrifood_tech:
    - 111998  # All Other Miscellaneous Crop Farming
    - 112990  # All Other Animal Production
    - 311999  # All Other Miscellaneous Food Manufacturing
    - 311211  # Flour Milling
    - 311221  # Wet Corn Milling
    - 311230  # Breakfast Cereal Manufacturing

# ── Research overlay tags (no SIC/NAICS home) ────────────────────────────────
# These categories are confirmed to have no clean classification code in any
# standard system. They are retained as research-defined tags layered on top
# of real company SIC codes — never used as standalone industry names.
# Source: industry nomenclature reconciliation slides (V7, 6.15.26) and
# UK government Industrial Strategy confirmation.

research_overlay_tags:
  - packaging           # spans SIC 26 (paper) and SIC 30 (plastic) — tag only
  - climate_tech        # applied across all climate tech clusters above
  - carbon_removal_ccu  # no SIC/NAICS home; frontier industry tag only
  - nuclear_fusion      # no SIC/NAICS home; pre-commercial R&D; tag only

# ── Tier structure reference ──────────────────────────────────────────────────
# Source: tiered approach document (V1.6, 6.21.26)
# This section is metadata only — not read by any script.
# Included here so the config is a single source of truth for the project.

tier_structure:
  tier_1:
    description: "Full compilation + full validation. 19 industries."
    industries:
      - chemicals
      - plastics_finished_products
      - packaging_paper          # + plastic packaging overlay via plastics codes
      - construction_materials
      - steel_metals
      - textiles
      - apparel
      - food
      - agriculture
      - cosmetics_personal_care
      - batteries_energy_storage
      - solar_photovoltaics
      - wind_energy
      - green_hydrogen
      - nuclear_fission           # NAICS 221113
      - carbon_removal_ccu        # tag only — no SIC anchor
      - nuclear_fusion            # tag only — no SIC anchor
      - transportation            # includes aerospace (SIC 372 sub-group)
      - construction_materials    # cement + steel + full SIC 32

  tier_2:
    description: "Full compilation + partial validation. 2 industries."
    industries:
      - pharmaceuticals
      - consumer_durables_furniture

  tier_3:
    description: >
      Compiled and classified; no validation this phase. Absence of validation
      reflects resource limits, not lack of expected signal.
    industries:
      - electronics_semiconductors
      # footwear: no dedicated SIC block in config yet — add when building list
      # furniture/home goods: overlaps consumer_durables_furniture above

  all_else:
    description: >
      Not pursued this phase. Explicitly out of scope — not silently omitted.
    industries:
      - paper_pulp_non_packaging
      - medical_devices
      - toys_games
      - telecommunications_equipment
      - industrial_heavy_machinery
      - computers_peripherals
      - household_appliances
      - sporting_goods
      - musical_instruments
      - glass_non_construction
      - jewelry
      - leather_goods_non_footwear
      - printing_publishing
      - tobacco_products
    excluded:
      - mining_extraction   # upstream raw-material activity, not product design

