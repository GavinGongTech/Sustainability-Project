    - "ESG report"
    - "IR presentation"
    - "exchange filing"   # LSE RNS, Euronext, EDINET, HKEXnews, etc.
    - "patent"
    - "press release"

  startup:
    - "product page"
    - "engineering blog"
    - "press release"
    - "white paper"
    - "patent"
    - "founder interview"

