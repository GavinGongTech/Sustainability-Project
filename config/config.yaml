# ─────────────────────────────────────────────────────────────────────────────
# Pipeline Configuration — Using AI in Design to Improve Product Sustainability
# NYU CSB Research Grant 2026
#
# SIC codes: column 5 (EDGAR pull codes) from Industry Nomenclature
# Reconciliation document, verified by interrogate_sic.py (July 2026).
# Only codes that exist as separate EDGAR entries are listed.
# ─────────────────────────────────────────────────────────────────────────────

# SEC EDGAR requires name + email in every request header
user:
  name:  "Gavin Gong"
  email: "gyg2009@nyu.edu"

rate_limits:
  sec_requests_per_second: 8    # SEC limit is 10 — stay under
  general_delay_seconds:   1.5  # pause between non-EDGAR requests
  max_retries:    3
  backoff_factor: 2             # exponential backoff on retries

paths:
  raw:        data/raw
  normalized: data/normalized
  index:      data/index
  logs:       logs

exchanges: [NYSE, NASDAQ, AMEX]

# ─────────────────────────────────────────────────────────────────────────────
# SIC CODES BY INDUSTRY
# Overlapping pulls (e.g. Chemicals ↔ Plastics, Cement ↔ Construction
# Materials) are intentional. Companies are deduplicated at classification.
# Climate Tech entries are research overlay tags on top of real SIC codes.
# ─────────────────────────────────────────────────────────────────────────────
sic_codes:

  # ── Tier 1 Legacy ──────────────────────────────────────────────────────────

  chemicals:          # SIC 28: Chemicals & Allied Products — whole division
    - 2800  # Chemicals & Allied Products
    - 2810  # Industrial Inorganic Chemicals (covers 2812 Alkalies, 2813 Gases, 2816 Pigments, 2819 NEC)
    - 2820  # Plastic Material, Synth Resin/Rubber, Cellulos
    - 2821  # Plastic Materials, Synth Resins & Nonvulcan Elastomers
    - 2833  # Medicinal Chemicals & Botanical Products
    - 2834  # Pharmaceutical Preparations
    - 2835  # In Vitro & In Vivo Diagnostic Substances
    - 2836  # Biological Products (No Diagnostic Substances)
    - 2840  # Soap, Detergents, Cleaning Preparations, Perfumes, Cosmetics
    - 2842  # Specialty Cleaning, Polishing & Sanitation Preparations
    - 2844  # Perfumes, Cosmetics & Other Toilet Preparations
    - 2851  # Paints, Varnishes, Lacquers, Enamels & Allied Products
    - 2860  # Industrial Organic Chemicals
    - 2870  # Agricultural Chemicals
    - 2890  # Miscellaneous Chemical Products
    - 2891  # Adhesives & Sealants

  plastics:           # SIC 282 (materials) + SIC 308 (finished products)
    - 2820  # Plastic Material, Synth Resin/Rubber, Cellulos
    - 2821  # Plastic Materials, Synth Resins & Nonvulcan Elastomers
    - 3080  # Miscellaneous Plastics Products
    - 3081  # Unsupported Plastics Film & Sheet
    - 3086  # Plastics Foam Products
    - 3089  # Plastics Products, NEC

  cement_concrete:    # SIC 324 + 327 — confirmed by interrogate_sic.py
    - 3241  # Cement, Hydraulic                          (20 filers)
    - 3270  # Concrete, Gypsum & Plaster Products        (17 filers; captures 3273 roll-ups)
    - 3272  # Concrete Products, Except Block & Brick    (24 filers)

  steel_metals:       # SIC 33: Primary Metal Industries — whole division
    - 3310  # Steel Works, Blast Furnaces & Rolling & Finishing Mills
    - 3312  # Steel Works, Blast Furnaces & Rolling Mills (Coke Ovens)
    - 3317  # Steel Pipe & Tubes
    - 3320  # Iron & Steel Foundries
    - 3330  # Primary Smelting & Refining of Nonferrous Metals
    - 3334  # Primary Production of Aluminum
    - 3341  # Secondary Smelting & Refining of Nonferrous Metals
    - 3350  # Rolling, Drawing & Extruding of Nonferrous Metals
    - 3357  # Drawing & Insulating of Nonferrous Wire
    - 3360  # Nonferrous Foundries (Castings)
    - 3390  # Miscellaneous Primary Metal Products

  construction_materials:  # SIC 32: Stone, Clay, Glass & Concrete — whole division
    - 3211  # Flat Glass
    - 3220  # Glass & Glassware, Pressed or Blown
    - 3221  # Glass Containers
    - 3231  # Glass Products, Made of Purchased Glass
    - 3241  # Cement, Hydraulic              (overlap with cement_concrete)
    - 3250  # Structural Clay Products       (16 filers — brick, tile, refractories)
    - 3260  # Pottery & Related Products     (8 filers)
    - 3270  # Concrete, Gypsum & Plaster     (overlap with cement_concrete)
    - 3272  # Concrete Products, Excl Block  (overlap with cement_concrete)
    - 3281  # Cut Stone & Stone Products
    - 3290  # Abrasive, Asbestos & Misc Nonmetallic Mineral Products

  textiles:           # SIC 22: Textile Mill Products — whole division
    - 2200  # Textile Mill Products (group level — captures roll-ups)
    - 2211  # Broadwoven Fabric Mills, Cotton
    - 2221  # Broadwoven Fabric Mills, Man Made Fiber & Silk
    - 2250  # Knitting Mills
    - 2253  # Knit Outerwear Mills
    - 2273  # Carpets & Rugs

  apparel:            # SIC 23: Apparel & Other Finished Products — whole division
    - 2300  # Apparel & Other Finished Products of Fabrics (group level)
    - 2320  # Men's & Boys' Furnishings, Work Clothing & Allied Garments
    - 2330  # Women's, Misses' & Juniors' Outerwear
    - 2340  # Women's, Misses', Children's & Infants' Undergarments
    - 2390  # Miscellaneous Fabricated Textile Products

  packaging:          # SIC 26 (paper) + SIC 30 (plastic) — research overlay tag
    - 2650  # Paperboard Containers & Boxes
    - 2670  # Converted Paper & Paperboard Products (No Containers/Boxes)
    - 2673  # Plastics, Foil & Coated Paper Bags
    - 3080  # Miscellaneous Plastics Products      (overlap with plastics)
    - 3081  # Unsupported Plastics Film & Sheet    (overlap with plastics)
    - 3086  # Plastics Foam Products               (overlap with plastics)
    - 3089  # Plastics Products, NEC               (overlap with plastics)

  cosmetics_personal_care:  # SIC 284 — confirmed by interrogate_sic.py
    - 2840  # Soap, Detergents, Cleaning Preparations, Perfumes, Cosmetics  (49 filers)
    - 2842  # Specialty Cleaning, Polishing & Sanitation Preparations        (36 filers)
    - 2844  # Perfumes, Cosmetics & Other Toilet Preparations               (100 filers)

  food:               # SIC 20: Food & Kindred Products — whole division
    - 2000  # Food & Kindred Products (group level)
    - 2011  # Meat Packing Plants
    - 2013  # Sausages & Other Prepared Meat Products
    - 2015  # Poultry Slaughtering & Processing
    - 2020  # Dairy Products
    - 2024  # Ice Cream & Frozen Desserts
    - 2030  # Canned, Frozen & Preserved Fruit, Veg & Food Specialties
    - 2033  # Canned Fruits, Veg, Preserves, Jams & Jellies
    - 2040  # Grain Mill Products
    - 2050  # Bakery Products
    - 2052  # Cookies & Crackers
    - 2060  # Sugar & Confectionery Products
    - 2070  # Fats & Oils
    - 2080  # Beverages
    - 2082  # Malt Beverages
    - 2086  # Bottled & Canned Soft Drinks & Carbonated Waters
    - 2090  # Miscellaneous Food Preparations & Kindred Products
    - 2092  # Prepared Fresh or Frozen Fish & Seafoods

  agriculture:        # SIC 01: Agricultural Production Crops
    - 100   # Agricultural Production, Crops (only EDGAR entry for SIC 01)

  # ── Tier 2 Legacy ──────────────────────────────────────────────────────────

  pharmaceuticals:    # SIC 283 — excludes 2833 and 2835 per nomenclature doc
    - 2834  # Pharmaceutical Preparations
    - 2836  # Biological Products (No Diagnostic Substances)

  consumer_durables:  # SIC 25: Furniture & Fixtures — confirmed by interrogate_sic.py
    - 2510  # Household Furniture                                    (61 filers)
    - 2511  # Wood Household Furniture (No Upholstered)              (21 filers)
    - 2520  # Office Furniture                                      (100 filers)
    - 2522  # Office Furniture (No Wood)                             (18 filers)
    - 2531  # Public Building & Related Furniture                     (9 filers)
    - 2540  # Partitions, Shelving, Lockers & Office Fixtures   (7 filers — PI decision pending)
    - 2590  # Miscellaneous Furniture & Fixtures                     (23 filers)

  transportation:     # SIC 37: Transportation Equipment — excludes 376 Guided Missiles
    - 3711  # Motor Vehicles & Passenger Car Bodies
    - 3713  # Truck & Bus Bodies
    - 3714  # Motor Vehicle Parts & Accessories
    - 3715  # Truck Trailers
    - 3716  # Motor Homes
    - 3720  # Aircraft & Parts (group level)
    - 3721  # Aircraft
    - 3724  # Aircraft Engines & Engine Parts
    - 3728  # Aircraft Parts & Auxiliary Equipment, NEC
    - 3730  # Ship & Boat Building & Repairing
    - 3743  # Railroad Equipment
    - 3751  # Motorcycles, Bicycles & Parts
    - 3790  # Miscellaneous Transportation Equipment

  aerospace_aircraft: # SIC 372 — sub-group of transportation, overlaps intentionally
    - 3720  # Aircraft & Parts (group level)
    - 3721  # Aircraft
    - 3724  # Aircraft Engines & Engine Parts
    - 3728  # Aircraft Parts & Auxiliary Equipment, NEC

  # ── Climate Tech (research overlay tags on top of real SIC) ───────────────

  batteries_energy_storage:
    # 3691/3692 are valid SIC codes but not separate EDGAR entries — roll up to 3690
    - 3690  # Miscellaneous Electrical Machinery, Equipment & Supplies

  solar_photovoltaics:
    # 4911 Electric Services excluded — utility generation, not product design
    - 3674  # Semiconductors & Related Devices   (primary — PV cells)
    - 3679  # Electronic Components, NEC         (secondary — may include module assemblers)

  wind_energy:
    # 3511 is valid SIC but not a separate EDGAR entry — rolls up to 3510
    - 3510  # Engines & Turbines
    - 3559  # Special Industry Machinery, NEC

  green_hydrogen:
    # 2813 Industrial Gases is valid SIC but not a separate EDGAR entry — rolls up to 2810
    # 2810 is already inside chemicals pull — overlap is intentional
    - 2810  # Industrial Inorganic Chemicals

  # nuclear_fission: no SIC equivalent exists; NAICS 221113 has no EDGAR pull path
  # carbon_removal_ccu: no SIC anchor — tag only; companies found via VC crawls
  # nuclear_fusion: pre-commercial R&D — no SIC or NAICS code; tag only

