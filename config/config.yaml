  # ── CLIMATE TECH CLUSTERS ─────────────────────────────────────────────────
  # These are research overlay tags, not standalone SIC categories.
  # Each cluster spans multiple SIC codes because the underlying activity
  # (e.g. wind power) includes both equipment manufacturing and energy generation,
  # which sit in different parts of the SIC system.
  # Following UK government precedent: these are "frontier industries" that
  # "cannot be easily represented" by a single SIC code.
  # Applied as a tag layered on top of the real SIC classification.

  # Batteries / Energy Storage
  # Real, codeable manufacturing activity. Climate Tech tag applied as overlay
  # since not every battery manufacturer is sustainability-focused.
  batteries_energy_storage:
    - 3691   # Storage Batteries
    - 3692   # Primary Batteries, Dry & Wet
    - 3699   # Electronic & Other Electrical Industrial Apparatus NEC

  # Solar / Photovoltaics
  # Spans manufacturing (SIC 3674 — PV cells are semiconductors) and
  # utility generation (SIC 4911). Consistent with UK frontier industry precedent.
  solar_photovoltaics:
    - 3674   # Semiconductors & Related Devices (PV cells)
    - 3559   # Special Industry Machinery NEC (solar manufacturing equipment)
    - 4911   # Electric Services (solar generation utilities)
    - 4931   # Electric & Other Services Combined
    - 4939   # Combination Electric & Gas & Other Utility Services NEC

  # Wind Energy
  # Spans turbine/equipment manufacturing and electric services generation.
  wind_energy:
    - 3511   # Steam, Gas & Hydraulic Turbines & Turbine Generator Sets
    - 3559   # Special Industry Machinery NEC (wind manufacturing equipment)
    - 3679   # Electronic Components NEC (wind control systems)
    - 4911   # Electric Services (wind generation utilities)
    - 4931   # Electric & Other Services Combined

