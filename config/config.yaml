# ═══════════════════════════════════════════════════════════════════════════════
# Pipeline Configuration
# Project: Using AI in Design to Improve Product Sustainability
# NYU CSB Research Grant 2026
#
# Edit this file to control what gets fetched.
# All scripts read from here — changing a value here affects the whole pipeline.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Your identity — REQUIRED for SEC EDGAR ────────────────────────────────────
# SEC enforces this. Every request must include your name and email in the
# User-Agent header or you will be blocked.
user:
  name: "Gavin Gong"
  email: "gyg2009@nyu.edu"

# ── Rate limiting ──────────────────────────────────────────────────────────────
# SEC allows up to 10 requests/second. Stay at 8 to be safe.
# general_delay is the pause between scraping non-EDGAR sites (startup pages,
# ESG reports, IR pages). Be polite — 1.5s minimum.
rate_limits:
  sec_requests_per_second: 8
  general_delay_seconds: 1.5
  max_retries: 3
  backoff_factor: 2            # exponential backoff: waits 1s, 2s, 4s on retries

# ── Output paths ───────────────────────────────────────────────────────────────
paths:
  raw:        data/raw          # untouched fetched content
  normalized: data/normalized   # cleaned markdown files (one per source)
  index:      data/index        # master_index.csv and company list CSVs
  logs:       logs              # one log file per script

# ── Exchanges to include for public US companies ───────────────────────────────
exchanges:
  - NYSE
  - NASDAQ
  - AMEX

# ══════════════════════════════════════════════════════════════════════════════
# INDUSTRY TIERS — from the project tier structure document (V1.6, 6.21.26)
#
# Tier 1: 19 industries — full compilation + full validation
# Tier 2:  2 industries — full compilation + partial validation
# Tier 3:  3 industries — compiled + classified, no validation this phase
# All Else: not pursued this phase
#
# SIC is the primary classification system (governs EDGAR).
# NAICS is used as a secondary reference where SIC is not granular enough.
# "Climate Tech" is a research overlay tag, not a separate SIC industry.
# ══════════════════════════════════════════════════════════════════════════════

